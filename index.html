<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Mirror · 镜像入口</title>
  <meta name="description" content="通过一个入口拉取 Docker Hub、GHCR、Quay 等公开容器镜像。">
  <script>
    (() => {
      let theme;
      try { theme = window.localStorage.getItem('mirror-theme'); } catch { /* Browser storage may be disabled. */ }
      const dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript><p>开启 JavaScript 后即可生成命令。也可查看 <a href="https://github.com/fqix/cloudflare-container-mirror">使用说明</a>。</p></noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
